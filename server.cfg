add_ace identifier.fivem:YOUR_FIVEM_ID pengu.admin allow
add_ace identifier.license:YOUR_LICENSE_HASH pengu.admin allow
add_ace identifier.fivem:YOUR_FIVEM_ID pengu.admin allow

# icarus.bypass: owner exemption from the Icarus anticheat. -- PenguRP
# Icarus/config.lua also self-grants these via ExecuteCommand at resource start, but on a COLD
# boot that runs before `exec permissions.cfg` (below) has granted resource.Icarus the
# command.add_ace privilege, so those calls are denied. Granting here makes cold boots correct;
# the in-resource ExecuteCommand then only matters for runtime restarts (where it succeeds).
add_ace identifier.fivem:YOUR_FIVEM_ID icarus.bypass allow
add_ace identifier.license:YOUR_LICENSE_HASH icarus.bypass allow
add_ace identifier.fivem:YOUR_FIVEM_ID icarus.bypass allow

exec permissions.cfg

