## You CAN edit the following:
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_maxclients 48
set steam_webApiKey "none"
sets tags "default, deployer, qbox"

## You MAY edit the following:
sv_licenseKey "CHANGEME"
sv_hostname "PenguRP built with Qbox Project by The Community!"
sets sv_projectName "[Qbox Project] PenguRP"
sets sv_projectDesc "A FiveM core with a load of bloat."
sets locale "root-AQ" # replace with your language and location code, like en-US, pt-BR, etc
load_server_icon myLogo.png
set sv_enforceGameBuild 3751
set mysql_connection_string "mysql://DB_USER:DB_PASS@localhost/fivem?charset=utf8mb4"

# Chat config
set resources_useSystemChat true
set qbx_chat:joinMessage ""
set qbx_chat:quitMessage ""

# Voice config
exec voice.cfg

# Qbox config
setr qb_locale "en"
# PenguRP: theme ALL ox_lib UIs (menus / dialogs / notify / progress / skillcheck) to a lavender accent
# so they match the HUD/MDT lavender glass theme (#c084fc / #E1C7F9). ox_lib takes a Mantine color NAME;
# 'violet' shade 4 (#9775fa) is the closest blue-leaning lavender (grape leans magenta).
setr ox:primaryColor "violet"
setr ox:primaryShade 4
setr qbx:enableBridge "true" # When true, enables the qb-core bridge for qbx_core
set qbx:enableQueue "true" # When true, enables qbx_core's built-in queue system
set qbx:bucketLockdownMode "inactive" # Sets the lockdown mode as inactive read here: https://docs.fivem.net/natives/?_0xA0F2201F
set qbx:discordLink "discord.gg/qbox" # Sets the servers discord link
set qbx:max_jobs_per_player 1 # Sets the number of jobs per player
set qbx:max_gangs_per_player 1 # Sets the number of gangs per player
set qbx:setjob_replaces "true" # When true, the SetJob function deletes the previous primary job of the player before setting the new one
set qbx:setgang_replaces "true" # When true, the SetGang function deletes the previous primary gang of the player before setting the new one
set qbx:cleanPlayerGroups "true" # When true, on server startup, the database will be checked for any groups/grades players have that are not in config files and removes them from the database if so
set qbx:allowMethodOverrides "true" # When true, enables the ability of resources to override existing methods in the player object
set qbx:disableOverrideWarning "false" # When true, disables warnings from resources overriding existing methods in the player object
setr qbx:enableVehiclePersistence "false" # When true, player vehicles marked for persistence will be respawned when deleted
setr qbx:vehiclePersistenceType "semi" # When "full", player vehicles will also be respawned after server restarts, when "semi", they will only respawn when deleted
set qbx:acknowledge "true" # When true, disables the default service message
setr qbx:enableGroupManagement "false" # When true, allows bosses to manage job/gang grades. Specifically the grade name.

# PenguRP: enable ox_target interactions in qbx scripts that check this convar
setr UseTarget "true"

# Message displayed to players in the chat after loading in
setr qbx:motd ""

# Fill with a Discord webhook URL to mirror /report (qbx_adminmenu) to Discord. Empty = disabled.
set pengu_report_webhook ""

# illenium-appearance locale config
setr illenium-appearance:locale "en"

# Renewed-Weathersync config
setr weather_disablecd true

# scully_emotemenu: disable the ragdoll key (was 'U', clashed with our voice-range bind).
# Empty string makes scully skip loading its ragdoll module entirely.
setr scully_emotemenu:ragdollKey ""
# scully_emotemenu: move facial expressions OFF /f (now /face or /exp) so /f is free for the
# faction chat command (pengu_core). Default was ["f", "face"].
setr scully_emotemenu:expressionCommands ["face", "exp"]
# scully_emotemenu: disable the stance key (default 'LCONTROL'), which collided with our crouch
# (qbx_crouch is now on LCONTROL). Empty string makes scully skip loading its stance module.
setr scully_emotemenu:stanceKey ""

# ox_inventory keys [primary, secondary, hotbar]. TAB opens the inventory; K is
# REMOVED here so it no longer opens the glovebox - K is now only the vehicle
# lock/unlock (qbx_vehiclekeys). Default was ["F2","K","TAB"].
# Hotbar moved F7 -> F3: F7 collides with the pengu_hud settings bind; F3 verified unused.
setr inventory:keys ["TAB","F2","F3"]

# Ox resources config
exec ox.cfg

# NPWD config
set npwd:framework "qbx"
# fill them in if you want extra phone functionality https://projecterror.dev/docs/npwd/start/installation#setting-up-camera-functionality
set SCREENSHOT_BASIC_TOKEN ""
set NPWD_AUDIO_TOKEN ""

# loadscreen config
setr loadscreen:externalShutdown true
set loadscreen:primaryColor "#f1e542"
set loadscreen:shadowColor "#1a18077f"

# These resources will start by default.
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
stop basic-gamemode
ensure hardcap
ensure baseevents

# Qbox & Extra stuff
ensure ox_lib
ensure qbx_core
ensure ox_target
ensure [ox]
ensure [qbx]
ensure [standalone]
ensure [voice]
ensure [assets]

ensure [npwd-apps]
ensure qbx_npwd
ensure npwd

stop qbx_hud
# PenguRP: no spawn selector. With qbx_spawn stopped, qbx_core spawns returning chars at their
# last location (spawnLastLocation) and new chars at defaultSpawn (startingApartment=false), no menu.
stop qbx_spawn

ensure [local]
ensure pengu_xp
ensure pengu_hud
ensure pengu_mdt
ensure pengu_traffic
